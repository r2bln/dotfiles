# linux_display_server x11
# wayland_titlebar_color none

# Конфиг, приближающий kitty к внешнему виду/поведению GNOME Terminal "из коробки"

# ---------- Шрифт ----------
# GNOME Terminal по умолчанию берёт системный моноширинный шрифт (обычно ~11-12pt)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
disable_ligatures never

# ---------- Окно ----------
# В GNOME Terminal есть обычная заголовочная строка окна (декорации) — оставляем их
hide_window_decorations no
window_padding_width 2
window_margin_width 0
window_border_width 0.5pt
draw_minimal_borders yes
placement_strategy center

# Без прозрачности — как в дефолтном профиле GNOME Terminal
background_opacity 1.0
dynamic_background_opacity no

# ---------- Цвета ----------
# Классическая тема GNOME Terminal: чёрный фон, светло-серый/белый текст
foreground #d3d7cf
background #000000
cursor #d3d7cf
cursor_shape block
cursor_blink_interval 0.5

selection_foreground #000000
selection_background #b5d5ff

# 16-цветная палитра как в GNOME Terminal (Tango-like, дефолт GNOME/VTE)
color0  #2e3436
color1  #cc0000
color2  #4e9a06
color3  #c4a000
color4  #3465a4
color5  #75507b
color6  #06989a
color7  #d3d7cf
color8  #555753
color9  #ef2929
color10 #8ae234
color11 #fce94f
color12 #729fcf
color13 #ad7fa8
color14 #34e2e2
color15 #eeeeec

# ---------- Скроллбэк и звук ----------
scrollback_lines 10000
enable_audio_bell yes
visual_bell_duration 0.0
window_alert_on_bell yes

# ---------- Вкладки ----------
# В GNOME Terminal вкладки простые, сверху, без "powerline" наворотов
# tab_bar_edge top
tab_bar_style separator
tab_separator "    |    "
tab_title_template "{title}"
active_tab_foreground   #ffffff
active_tab_background   #333333
inactive_tab_foreground #d3d7cf
inactive_tab_background #1a1a1a

# ---------- Хоткеи ----------
# Вкладки = «терминалы», как в GNOME Terminal
map alt+t     new_tab
map alt+right next_tab
map alt+left  previous_tab
# То же на русской раскладке (кнопка T выдаёт «е»)
map alt+е     new_tab

# ---------- Поведение ----------
shell_integration enabled
copy_on_select yes
strip_trailing_spaces smart
confirm_os_window_close 0
allow_remote_control no
